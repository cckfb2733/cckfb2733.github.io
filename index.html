<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海e行</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f5f6f8; color: #1c1c1e;
    font: -apple-system-body;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 24px; box-sizing: border-box;
  }
  .card { width: 100%; max-width: 320px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.6; color: #6b6f76; margin: 0 0 24px; }
  .btn {
    display: block; padding: 14px 0; border-radius: 12px;
    background: #1677ff; color: #fff; text-decoration: none;
    font-size: 17px; font-weight: 600;
  }
  .tip { font-size: 13px; color: #9a9ea6; margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>海e行</h1>
    <p>正在为你打开 App Store…</p>
    <a class="btn" href="https://apps.apple.com/cn/app/id1407103585">前往 App Store 下载</a>
    <p class="tip">已安装海e行？请返回原页面重新点击链接。</p>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent;
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isWeChat = /MicroMessenger/.test(ua);
      if (isIOS && !isWeChat) {
        setTimeout(function () {
          location.href = 'itms-apps://itunes.apple.com/app/id1407103585';
        }, 100);
      }
    })();
  </script>
</body>
</html>
